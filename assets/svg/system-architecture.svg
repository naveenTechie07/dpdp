<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <linearGradient id="grad-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f1f5f9;stop-opacity:1" />
    </linearGradient>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.15" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1100" height="700" fill="url(#grad-bg)" />
  
  <!-- Title -->
  <text x="550" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#0f172a">Srujana (DataSentinel) — System Architecture</text>
  <text x="550" y="52" text-anchor="middle" font-size="12" fill="#64748b">DPDP Act 2023 Compliance Platform for Indian MSMEs · Dual-Persona (MSME + Citizen)</text>
  
  <!-- Layer: Client Browser -->
  <rect x="50" y="80" width="1000" height="110" rx="12" fill="url(#grad-card)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="105" font-size="13" font-weight="700" fill="#0ea5e9">▌ CLIENT BROWSER LAYER</text>
  <text x="70" y="128" font-size="11.5" fill="#334155">React 19 SPA (Vite + Tailwind CSS v4) · Dual Persona Dashboard</text>
  
  <!-- MSME Dashboard box -->
  <rect x="70" y="140" width="460" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="85" y="160" font-size="10.5" font-weight="700" fill="#0f172a">🏢 MSME Enterprise Dashboard</text>
  <text x="85" y="174" font-size="9" fill="#64748b">Overview · Discovery · RoPA · Governance · Consent · DSR · Cookies · Audit</text>
  
  <!-- Citizen Portal box -->
  <rect x="550" y="140" width="480" height="40" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
  <text x="565" y="160" font-size="10.5" font-weight="700" fill="#0f172a">👤 Citizen Privacy Rights Portal</text>
  <text x="565" y="174" font-size="9" fill="#64748b">Data Access · Correction · Erasure · Nomination · Grievance · Receipt Verification</text>
  
  <!-- API Layer -->
  <rect x="50" y="205" width="1000" height="90" rx="12" fill="url(#grad-card)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="230" font-size="13" font-weight="700" fill="#0ea5e9">▌ VERCEL EDGE / API GATEWAY (Port 5000)</text>
  <text x="70" y="252" font-size="11.5" fill="#334155">HTTPS + Bearer JWT (Supabase Auth) · CORS · Helmet · JSON Parser · Tenant Isolation</text>
  <text x="70" y="272" font-size="10.5" fill="#475569">/api/v1/auth · /api/v1/platform · /api/v1/discovery · /api/v1/mapping · /api/v1/governance · /api/v1/consent · /api/v1/dsr · /api/v1/cookies</text>
  
  <!-- Backend Monolith -->
  <rect x="50" y="310" width="1000" height="130" rx="12" fill="url(#grad-card)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="335" font-size="13" font-weight="700" fill="#0ea5e9">▌ EXPRESS BACKEND MODULAR MONOLITH (Node.js + TypeScript)</text>
  
  <!-- Module grid -->
  <g>
    <!-- Row 1 -->
    <rect x="70" y="348" width="220" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="85" y="366" font-size="9.5" font-weight="700" fill="#0f172a">Auth</text>
    <text x="85" y="379" font-size="8.5" fill="#64748b">Register · Login · JWT · Tenant ISO</text>
    
    <rect x="300" y="348" width="220" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="315" y="366" font-size="9.5" font-weight="700" fill="#0f172a">Discovery</text>
    <text x="315" y="379" font-size="8.5" fill="#64748b">File Upload · Python Scanner · PII Findings</text>
    
    <rect x="530" y="348" width="220" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="545" y="366" font-size="9.5" font-weight="700" fill="#0f172a">Mapping / RoPA</text>
    <text x="545" y="379" font-size="8.5" fill="#64748b">Activities · Flows · Recipients · React Flow Graph</text>
    
    <rect x="760" y="348" width="270" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="775" y="366" font-size="9.5" font-weight="700" fill="#0f172a">Governance</text>
    <text x="775" y="379" font-size="8.5" fill="#64748b">Asset Classification · Retention Rules · CGST Lock</text>
    
    <!-- Row 2 -->
    <rect x="70" y="414" width="220" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="85" y="432" font-size="9.5" font-weight="700" fill="#0f172a">Consent</text>
    <text x="85" y="445" font-size="8.5" fill="#64748b">Multilingual Notices · SHA-256 Receipts · Withdrawal</text>
    
    <rect x="300" y="414" width="220" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="315" y="432" font-size="9.5" font-weight="700" fill="#0f172a">DSR</text>
    <text x="315" y="445" font-size="8.5" fill="#64748b">Access · Correction · Erasure · Tax Conflict Lock</text>
    
    <rect x="530" y="414" width="220" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="545" y="432" font-size="9.5" font-weight="700" fill="#0f172a">Cookies</text>
    <text x="545" y="445" font-size="8.5" fill="#64748b">Scanner · Categorizer · Consent Logging · Geo Rules</text>
    
    <rect x="760" y="414" width="270" height="55" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
    <text x="775" y="432" font-size="9.5" font-weight="700" fill="#0f172a">Audit</text>
    <text x="775" y="445" font-size="8.5" fill="#64748b">Append-Only Logs · SHA-256 Hash Chain · Immutable</text>
  </g>
  
  <!-- Database Layer -->
  <rect x="50" y="455" width="460" height="120" rx="12" fill="url(#grad-card)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
  <text x="70" y="480" font-size="13" font-weight="700" fill="#0ea5e9">▌ DATABASE (Supabase PostgreSQL via Prisma ORM)</text>
  <text x="70" y="502" font-size="11" fill="#334155">Tenant-isolated relational storage · 12 models · Strict tenantId filtering on every query</text>
  <text x="70" y="522" font-size="10" fill="#475569">Tenant · User · Role · AuditEvent · DataSource · ScanJob · ProcessingActivity · ConsentRecord · DsrRequest · DataAsset · Incident</text>
  
  <!-- Python Worker -->
  <rect x="530" y="455" width="220" height="120" rx="12" fill="url(#grad-card)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
  <text x="550" y="480" font-size="13" font-weight="700" fill="#0ea5e9">▌ OFFLINE PYTHON WORKER</text>
  <text x="550" y="502" font-size="11" fill="#334155">Python 3.10 + Pandas + OpenPyXL</text>
  <text x="550" y="522" font-size="10" fill="#475569">Verhoeff D₅ Aadhaar · PAN · Mobile · Health Data · Zero Cloud Leakage</text>
  <text x="550" y="542" font-size="10" fill="#475569">Spawned as child process · 100% local execution</text>
  
  <!-- Auth -->
  <rect x="770" y="455" width="280" height="120" rx="12" fill="url(#grad-card)" stroke="#e2e8f0" stroke-width="2" filter="url(#shadow)" />
  <text x="790" y="480" font-size="13" font-weight="700" fill="#0ea5e9">▌ AUTH (Supabase GoTrue)</text>
  <text x="790" y="502" font-size="11" fill="#334155">JWT verification · User management · Row Level Security readiness</text>
  <text x="790" y="522" font-size="10" fill="#475569">Service role key for server-side operations</text>
  <text x="790" y="542" font-size="10" fill="#475569">BCrypt password hashing · Session management</text>
  
  <!-- Connections -->
  <line x1="300" y1="190" x2="300" y2="205" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="790" y1="190" x2="790" y2="205" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="300" y1="310" x2="300" y2="325" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="300" y1="440" x2="280" y2="455" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="640" y1="440" x2="640" y2="455" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="910" y1="440" x2="930" y2="455" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Legend -->
  <rect x="50" y="585" width="1000" height="90" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
  <text x="70" y="605" font-size="11" font-weight="700" fill="#0f172a">Legend</text>
  <rect x="70" y="615" width="12" height="12" fill="#0ea5e9" rx="2" />
  <text x="90" y="626" font-size="10" fill="#334155">Data / Control Flow</text>
  <rect x="200" y="615" width="12" height="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" rx="2" />
  <text x="220" y="626" font-size="10" fill="#334155">Service Module</text>
  <rect x="340" y="615" width="12" height="12" fill="#1e293b" rx="2" />
  <text x="360" y="626" font-size="10" fill="#334155">Data Store</text>
  <rect x="470" y="615" width="12" height="12" fill="#fbbf24" rx="2" />
  <text x="490" y="626" font-size="10" fill="#334155">Offline Compute</text>
  <rect x="590" y="615" width="12" height="12" fill="#818cf8" rx="2" />
  <text x="610" y="626" font-size="10" fill="#334155">Identity / Auth</text>
</svg>
