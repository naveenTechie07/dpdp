<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="600" viewBox="0 0 1100 600" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.15" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  
  <rect width="1100" height="600" fill="#f8fafc" />
  
  <text x="550" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">Consent Management Workflow</text>
  <text x="550" y="48" text-anchor="middle" font-size="12" fill="#64748b">DPDP Act Sections 5 &amp; 6 · Multilingual Notices (EN/HI/KN) · SHA-256 Receipts</text>
  
  <!-- Step 1: Notice -->
  <rect x="40" y="90" width="200" height="90" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">1. STATUTORY NOTICE</text>
  <text x="140" y="132" text-anchor="middle" font-size="9.5" fill="#334155">Section 5 — Itemised Notice</text>
  <text x="140" y="148" text-anchor="middle" font-size="9" fill="#64748b">English · Hindi · Kannada</text>
  
  <!-- Step 2: Affirmative Action -->
  <rect x="280" y="90" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="380" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">2. AFFIRMATIVE ACTION</text>
  <text x="380" y="132" text-anchor="middle" font-size="9.5" fill="#334155">Section 6 — Free, Specific, Informed</text>
  <text x="380" y="148" text-anchor="middle" font-size="9" fill="#64748b">WHATSAPP_YES · WEB_PORTAL · PAPER_SLIP · RECEPTION_DESK</text>
  
  <!-- Step 3: Validation Guard -->
  <rect x="520" y="90" width="200" height="90" rx="10" fill="#fef2f2" stroke="#ef4444" stroke-width="2" filter="url(#shadow)" />
  <text x="620" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">3. SECTION 6 GUARD</text>
  <text x="620" y="132" text-anchor="middle" font-size="9.5" fill="#991b1b">Zod validation rejects pre-ticked</text>
  <text x="620" y="148" text-anchor="middle" font-size="9" fill="#64748b">silence · inaction → HTTP 400</text>
  
  <!-- Step 4: Record Consent -->
  <rect x="760" y="90" width="200" height="90" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)" />
  <text x="860" y="115" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">4. RECORD CONSENT</text>
  <text x="860" y="132" text-anchor="middle" font-size="9.5" fill="#334155">ConsentRecord created</text>
  <text x="860" y="148" text-anchor="middle" font-size="9" fill="#64748b">tenantId · userRef · purposeId · channel · language</text>
  
  <!-- Step 5: SHA-256 Receipt -->
  <rect x="760" y="220" width="200" height="90" rx="10" fill="#f0fdf4" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <text x="860" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">5. SHA-256 RECEIPT</text>
  <text x="860" y="262" text-anchor="middle" font-size="9.5" fill="#15803d">Cryptographic digest</text>
  <text x="860" y="278" text-anchor="middle" font-size="9" fill="#64748b">SHA256(tenantId + userRef + purposeId + capturedAt)</text>
  
  <!-- Step 6: Consent Ledger -->
  <rect x="520" y="220" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="620" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">6. CONSENT LEDGER</text>
  <text x="620" y="262" text-anchor="middle" font-size="9.5" fill="#334155">Chronological grant/withdrawal</text>
  <text x="620" y="278" text-anchor="middle" font-size="9" fill="#64748b">GIVEN · WITHDRAWN · EXPIRED status</text>
  
  <!-- Step 7: Withdrawal -->
  <rect x="280" y="220" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="380" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">7. WITHDRAWAL (Sec 6(4))</text>
  <text x="380" y="262" text-anchor="middle" font-size="9.5" fill="#334155">Ease of withdrawal = ease of giving</text>
  <text x="380" y="278" text-anchor="middle" font-size="9" fill="#64748b">Immediate timestamping · withdrawal_at</text>
  
  <!-- Step 8: Preference Centre -->
  <rect x="40" y="220" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="245" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">8. PREFERENCE CENTRE</text>
  <text x="140" y="262" text-anchor="middle" font-size="9.5" fill="#334155">Self-service portal</text>
  <text x="140" y="278" text-anchor="middle" font-size="9" fill="#64748b">Purpose toggles · Channel config · Slug-based access</text>
  
  <!-- Step 9: Receipt Verify -->
  <rect x="40" y="350" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="375" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">9. RECEIPT VERIFICATION</text>
  <text x="140" y="392" text-anchor="middle" font-size="9.5" fill="#334155">Verify consent receipt</text>
  <text x="140" y="408" text-anchor="middle" font-size="9" fill="#64748b">GET /consent/records/:id/receipt</text>
  
  <!-- Arrows -->
  <line x1="240" y1="135" x2="280" y2="135" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="480" y1="135" x2="520" y2="135" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="720" y1="135" x2="760" y2="135" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="860" y1="180" x2="860" y2="210" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="860" y1="180" x2="620" y2="180" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="620" y1="180" x2="380" y2="180" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="380" y1="180" x2="140" y2="180" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="140" y1="310" x2="380" y2="310" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="380" y1="310" x2="620" y2="310" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="620" y1="310" x2="860" y2="310" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="860" y1="310" x2="860" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
  <line x1="860" y1="400" x2="140" y2="400" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
  
  <!-- Channels badge row -->
  <rect x="40" y="470" width="1020" height="100" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  <text x="60" y="490" font-size="11" font-weight="700" fill="#0f172a">Consent Channels &amp; Languages</text>
  
  <g>
    <rect x="60" y="500" width="230" height="60" rx="6" fill="#eff6ff" stroke="#bae6fd" stroke-width="1" />
    <text x="75" y="515" font-size="9.5" font-weight="700" fill="#1e40af">WHATSAPP_YES</text>
    <text x="75" y="530" font-size="8.5" fill="#64748b">Click-to-accept via wa.me</text>
    
    <rect x="310" y="500" width="230" height="60" rx="6" fill="#eff6ff" stroke="#bae6fd" stroke-width="1" />
    <text x="325" y="515" font-size="9.5" font-weight="700" fill="#1e40af">WEB_PORTAL</text>
    <text x="325" y="530" font-size="8.5" fill="#64748b">Online self-service form</text>
    
    <rect x="560" y="500" width="230" height="60" rx="6" fill="#eff6ff" stroke="#bae6fd" stroke-width="1" />
    <text x="575" y="515" font-size="9.5" font-weight="700" fill="#1e40af">PAPER_SLIP</text>
    <text x="575" y="530" font-size="8.5" fill="#64748b">Physical reception desk slip</text>
    
    <rect x="810" y="500" width="230" height="60" rx="6" fill="#eff6ff" stroke="#bae6fd" stroke-width="1" />
    <text x="825" y="515" font-size="9.5" font-weight="700" fill="#1e40af">RECEPTION_DESK</text>
    <text x="825" y="530" font-size="8.5" fill="#64748b">In-person affirmative consent</text>
  </g>
</svg>
