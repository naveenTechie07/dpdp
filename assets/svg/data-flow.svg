<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#0ea5e9" />
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="2" dy="4" result="offsetblur" />
      <feComponentTransfer><feFuncA type="linear" slope="0.15" /></feComponentTransfer>
      <feMerge><feMergeNode /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  
  <rect width="1100" height="650" fill="#f8fafc" />
  
  <text x="550" y="28" text-anchor="middle" font-size="18" font-weight="700" fill="#0f172a">End-to-End Data Flow</text>
  <text x="550" y="48" text-anchor="middle" font-size="12" fill="#64748b">Request lifecycle from client browser to database and back</text>
  
  <!-- Step 1: Client -->
  <rect x="40" y="80" width="200" height="90" rx="10" fill="#ffffff" stroke="#0ea5e9" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">1. CLIENT</text>
  <text x="140" y="122" text-anchor="middle" font-size="9.5" fill="#334155">React 19 SPA / SSR Portal</text>
  <text x="140" y="138" text-anchor="middle" font-size="9" fill="#64748b">HTTPS + Bearer JWT</text>
  
  <!-- Step 2: API Gateway -->
  <rect x="280" y="80" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="380" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">2. API GATEWAY</text>
  <text x="380" y="122" text-anchor="middle" font-size="9.5" fill="#334155">Express Middleware Stack</text>
  <text x="380" y="138" text-anchor="middle" font-size="9" fill="#64748b">CORS · Helmet · JWT Verify · Tenant Extract</text>
  
  <!-- Step 3: Validation -->
  <rect x="520" y="80" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="620" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">3. VALIDATION</text>
  <text x="620" y="122" text-anchor="middle" font-size="9.5" fill="#334155">Zod Schema Validation</text>
  <text x="620" y="138" text-anchor="middle" font-size="9" fill="#64748b">Statutory payload validation · Input sanitization</text>
  
  <!-- Step 4: Module Controller -->
  <rect x="760" y="80" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="860" y="105" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">4. MODULE CONTROLLER</text>
  <text x="860" y="122" text-anchor="middle" font-size="9.5" fill="#334155">Auth · Discovery · Mapping · Consent · DSR · Cookies · Audit</text>
  <text x="860" y="138" text-anchor="middle" font-size="9" fill="#64748b">Business logic orchestration</text>
  
  <!-- Step 5: Python Worker (optional) -->
  <rect x="760" y="210" width="200" height="90" rx="10" fill="#f1f5f9" stroke="#f59e0b" stroke-width="2" filter="url(#shadow)" />
  <text x="860" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">5a. OFFLINE PYTHON WORKER</text>
  <text x="860" y="252" text-anchor="middle" font-size="9.5" fill="#334155">PII Scanner (Discovery only)</text>
  <text x="860" y="268" text-anchor="middle" font-size="9" fill="#64748b">Verhoeff D₅ · Pandas · OpenPyXL · 100% local</text>
  
  <!-- Step 5b: Database -->
  <rect x="520" y="210" width="200" height="90" rx="10" fill="#ffffff" stroke="#1e293b" stroke-width="2" filter="url(#shadow)" />
  <text x="620" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">5b. DATABASE</text>
  <text x="620" y="252" text-anchor="middle" font-size="9.5" fill="#334155">Supabase PostgreSQL (Prisma)</text>
  <text x="620" y="268" text-anchor="middle" font-size="9" fill="#64748b">Tenant-isolated queries · where: { tenantId }</text>
  
  <!-- Step 6: Audit Log -->
  <rect x="280" y="210" width="200" height="90" rx="10" fill="#ffffff" stroke="#10b981" stroke-width="2" filter="url(#shadow)" />
  <text x="380" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">6. AUDIT LOG</text>
  <text x="380" y="252" text-anchor="middle" font-size="9.5" fill="#334155">Append-Only Event Log</text>
  <text x="380" y="268" text-anchor="middle" font-size="9" fill="#64748b">SHA-256 hash chaining · Immutable · DPBI inspection ready</text>
  
  <!-- Step 7: Response -->
  <rect x="40" y="210" width="200" height="90" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)" />
  <text x="140" y="235" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">7. RESPONSE</text>
  <text x="140" y="252" text-anchor="middle" font-size="9.5" fill="#334155">JSON / HTML Response</text>
  <text x="140" y="268" text-anchor="middle" font-size="9" fill="#64748b">{ success, data, message } · HTTP status codes</text>
  
  <!-- Arrows -->
  <line x1="240" y1="125" x2="280" y2="125" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="480" y1="125" x2="520" y2="125" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="720" y1="125" x2="760" y2="125" stroke="#0ea5e9" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="860" y1="170" x2="860" y2="200" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="860" y1="170" x2="620" y2="170" stroke="#1e293b" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="620" y1="170" x2="380" y2="170" stroke="#10b981" stroke-width="2" marker-end="url(#arrowhead)" />
  <line x1="380" y1="170" x2="140" y2="170" stroke="#cbd5e1" stroke-width="2" marker-end="url(#arrowhead)" />
  
  <!-- Return path -->
  <line x1="140" y1="255" x2="380" y2="255" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2" />
  <line x1="380" y1="255" x2="620" y2="255" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2" />
  <line x1="620" y1="255" x2="860" y2="255" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2" />
  <line x1="860" y1="255" x2="860" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2" />
  <line x1="860" y1="300" x2="240" y2="300" stroke="#94a3b8" stroke-width="2" stroke-dasharray="4,2" marker-end="url(#arrowhead)" />
  
  <!-- Labels -->
  <text x="260" y="140" text-anchor="middle" font-size="8.5" fill="#0ea5e9" font-weight="600">Request</text>
  <text x="500" y="140" text-anchor="middle" font-size="8.5" fill="#0ea5e9" font-weight="600">Request</text>
  <text x="740" y="140" text-anchor="middle" font-size="8.5" fill="#0ea5e9" font-weight="600">Request</text>
  <text x="550" y="315" text-anchor="middle" font-size="8.5" fill="#94a3b8" font-weight="600">Response</text>
  
  <!-- Color legend -->
  <rect x="40" y="340" width="1020" height="280" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" filter="url(#shadow)" />
  <text x="60" y="362" font-size="12" font-weight="700" fill="#0f172a">Flow Details &amp; Security Controls</text>
  
  <rect x="60" y="380" width="300" height="60" rx="8" fill="#eff6ff" stroke="#bae6fd" stroke-width="1" />
  <text x="75" y="396" font-size="9.5" font-weight="700" fill="#0c4a6e">Authentication &amp; Tenant Isolation</text>
  <text x="75" y="412" font-size="8.5" fill="#64748b">Every request carries JWT → tenantId extracted → all DB queries filtered by tenantId → zero cross-tenant leakage</text>
  
  <rect x="380" y="380" width="300" height="60" rx="8" fill="#fef3c7" stroke="#fde68a" stroke-width="1" />
  <text x="395" y="396" font-size="9.5" font-weight="700" fill="#78350f">Offline PII Scanning</text>
  <text x="395" y="412" font-size="8.5" fill="#64748b">Python child process scans CSV/XLSX locally · Verhoeff D₅ Aadhaar validation · zero data egress to cloud LLMs</text>
  
  <rect x="700" y="380" width="340" height="60" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1" />
  <text x="715" y="396" font-size="9.5" font-weight="700" fill="#14532d">Immutable Audit Trail</text>
  <text x="715" y="412" font-size="8.5" fill="#64748b">Every sensitive event logged with tenantId, actorId, IP, userAgent → SHA-256 hash chain → tamper-evident for DPBI inspection</text>
  
  <rect x="60" y="455" width="300" height="60" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1" />
  <text x="75" y="471" font-size="9.5" font-weight="700" fill="#6b21a8">Statutory Validation (Zod)</text>
  <text x="75" y="487" font-size="8.5" fill="#64748b">Runtime payload validation · Section 6 affirmative consent enforcement · DPDP_SEC_6_VIOLATION on pre-ticked boxes</text>
  
  <rect x="380" y="455" width="300" height="60" rx="8" fill="#fffbeb" stroke="#fdba74" stroke-width="1" />
  <text x="395" y="471" font-size="9.5" font-weight="700" fill="#78350f">CGST Tax Conflict Resolver</text>
  <text x="395" y="487" font-size="8.5" fill="#64748b">DSR erasure requests checked against CGST Act Sec 36 (72-month tax lock) · retention certificates issued for locked records</text>
  
  <rect x="700" y="455" width="340" height="60" rx="8" fill="#fff1f2" stroke="#fecaca" stroke-width="1" />
  <text x="715" y="471" font-size="9.5" font-weight="700" fill="#991b1b">Breach Notification (Sec 8(6))</text>
  <text x="715" y="487" font-size="8.5" fill="#64748b">Incident recording → scope assessment → DPBI notification → citizen intimation → 72-hour regulatory dossier</text>
</svg>
